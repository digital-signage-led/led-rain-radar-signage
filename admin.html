<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雨・レーダー 管理画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/signage.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
  <div class="admin-app">
    <header class="admin-bar">
      <div>
        <h1>雨・レーダー 管理</h1>
        <p>都道府県 → コンテンツ → 観測地点。編集は下書き、公開してから本番へ反映します。</p>
      </div>
      <div class="admin-actions">
        <span id="combo-status">公開済み</span>
        <button type="button" id="btn-save" class="ghost">下書き保存</button>
        <button type="button" id="btn-publish" class="warn">この組み合わせを公開</button>
        <button type="button" id="btn-publish-all">188件を公開</button>
        <button type="button" id="btn-open" class="ghost">本番URLを開く</button>
      </div>
    </header>

    <section class="admin-controls">
      <fieldset>
        <legend>選択</legend>
        <label>都道府県
          <select id="pref-select"></select>
        </label>
        <label>コンテンツ
          <select id="content-select"></select>
        </label>
        <label>観測地点
          <select id="point-select"></select>
        </label>
      </fieldset>

      <fieldset>
        <legend>雨・レーダー共通設定</legend>
        <label>タイトルサイズ <input id="title-size" data-live type="range" min="0.7" max="1.6" step="0.02"></label>
        <label>タイトル左右 <input id="title-x" data-live type="range" min="-80" max="80" step="1"></label>
        <label>タイトル上下 <input id="title-y" data-live type="range" min="-40" max="40" step="1"></label>
        <label>地図サイズ <input id="map-scale" data-live type="range" min="0.7" max="1.4" step="0.02"></label>
        <label>地図左右 <input id="map-x" data-live type="range" min="-80" max="80" step="1"></label>
        <label>地図上下 <input id="map-y" data-live type="range" min="-60" max="60" step="1"></label>
        <label>文字サイズ <input id="font-size" data-live type="range" min="0.8" max="1.4" step="0.02"></label>
        <label>情報パネル左右 <input id="panel-x" data-live type="range" min="-60" max="60" step="1"></label>
        <label>情報パネル上下 <input id="panel-y" data-live type="range" min="-40" max="40" step="1"></label>
        <label>余白 <input id="padding" data-live type="range" min="0.7" max="1.3" step="0.02"></label>
        <label class="check"><input id="show-stamp" data-live type="checkbox"> 更新時刻を表示</label>
        <label class="check"><input id="show-point" data-live type="checkbox"> 観測地点を表示</label>
        <label class="check"><input id="show-legend" data-live type="checkbox"> 凡例を表示</label>
        <label class="check"><input id="show-clock" data-live type="checkbox"> 現在時刻を表示</label>
        <label class="check"><input id="show-panel" data-live type="checkbox"> 情報パネルを表示</label>
        <label class="check"><input id="show-attr" data-live type="checkbox"> 出典を表示</label>
      </fieldset>

      <fieldset data-for-content="rain_forecast">
        <legend>雨の予報だけの設定</legend>
        <label class="check"><input id="show-weekly" data-live type="checkbox"> 週間降水確率</label>
        <label class="check"><input id="show-temps" data-live type="checkbox"> 気温</label>
      </fieldset>
      <fieldset data-for-content="rain_radar">
        <legend>雨雲レーダーだけの設定</legend>
        <label>コマ送り(ms) <input id="radar-play" data-live type="number" min="1200" max="4000" step="100"></label>
        <label>過去分数 <input id="radar-past" data-live type="number" min="30" max="90" step="5"></label>
      </fieldset>
      <fieldset data-for-content="future_rain">
        <legend>今後の雨だけの設定</legend>
        <label>コマ送り(ms) <input id="future-play" data-live type="number" min="1400" max="4000" step="100"></label>
        <label>先読み分数 <input id="future-min" data-live type="number" min="60" max="180" step="10"></label>
      </fieldset>
      <fieldset data-for-content="precipitation_nowcast">
        <legend>降水ナウキャストだけの設定</legend>
        <label>コマ送り(ms) <input id="nowcast-play" data-live type="number" min="1400" max="4000" step="100"></label>
        <label>予測分数 <input id="nowcast-horizon" data-live type="number" min="30" max="60" step="5"></label>
      </fieldset>
    </section>

    <section class="admin-preview" aria-label="プレビュー">
      <div id="preview-host"></div>
    </section>

    <section class="admin-urls">
      <h2>公開URL一覧（47都道府県 × 4コンテンツ = 188）</h2>
      <div class="filters">
        <input id="url-pref" type="text" placeholder="都道府県検索">
        <select id="url-content"></select>
        <select id="url-status">
          <option value="">すべての公開状態</option>
          <option value="published">公開済み</option>
          <option value="draft">下書き</option>
        </select>
        <strong id="url-count">188 / 188</strong>
      </div>
      <div class="url-wrap">
        <table>
          <thead>
            <tr><th>都道府県</th><th>コンテンツ</th><th>公開状態</th><th>公開URL</th><th></th></tr>
          </thead>
          <tbody id="url-table"></tbody>
        </table>
      </div>
    </section>
  </div>
  <div id="toast" hidden></div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
