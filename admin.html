<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雨・レーダー 管理画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/signage.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
  <div class="admin-app">
    <header class="admin-bar">
      <h1>雨・レーダー 管理</h1>
      <label class="bar-field">都道府県
        <select id="pref-select"></select>
      </label>
      <div class="content-fixed">
        <span class="k">コンテンツ</span>
        <strong>雨・レーダー</strong>
      </div>
      <label class="bar-field">観測地点
        <select id="point-select"></select>
      </label>
      <span id="combo-status">公開済み</span>
      <div class="admin-actions">
        <button type="button" id="btn-save" class="ghost">下書き保存</button>
        <button type="button" id="btn-publish" class="warn">この組み合わせを公開</button>
        <button type="button" id="btn-publish-all">全件を公開</button>
        <button type="button" id="btn-open" class="ghost">本番URLを開く</button>
      </div>
    </header>

    <section class="admin-controls">
      <label>タイトル大きさ <input id="title-size" data-live type="range" min="0.7" max="1.6" step="0.02"></label>
      <label>タイトル左右 <input id="title-x" data-live type="range" min="-80" max="80" step="1"></label>
      <label>タイトル上下 <input id="title-y" data-live type="range" min="-40" max="40" step="1"></label>
      <label>地図サイズ <input id="map-scale" data-live type="range" min="0.7" max="1.4" step="0.02"></label>
      <label>地図左右 <input id="map-x" data-live type="range" min="-80" max="80" step="1"></label>
      <label>地図上下 <input id="map-y" data-live type="range" min="-60" max="60" step="1"></label>
      <label>文字サイズ <input id="font-size" data-live type="range" min="0.8" max="1.4" step="0.02"></label>
      <label>パネル左右 <input id="panel-x" data-live type="range" min="-60" max="60" step="1"></label>
      <label>パネル上下 <input id="panel-y" data-live type="range" min="-40" max="40" step="1"></label>
      <label>余白 <input id="padding" data-live type="range" min="0.7" max="1.3" step="0.02"></label>
      <label>コマ送りms <input id="rain-play" data-live type="number" min="400" max="2000" step="100"></label>
      <label>今後の分数 <input id="future-min" data-live type="number" min="60" max="180" step="10"></label>
      <label class="check"><input id="show-stamp" data-live type="checkbox"> 更新時刻</label>
      <label class="check"><input id="show-point" data-live type="checkbox"> 観測地点</label>
      <label class="check"><input id="show-legend" data-live type="checkbox"> 凡例</label>
      <label class="check"><input id="show-clock" data-live type="checkbox"> 現在時刻</label>
      <label class="check"><input id="show-panel" data-live type="checkbox"> 情報パネル</label>
      <label class="check"><input id="show-attr" data-live type="checkbox"> 出典</label>
      <label class="check"><input id="show-temps" data-live type="checkbox"> 気温</label>
    </section>

    <section class="admin-urls">
      <h2>公開URL一覧（全国＋47都道府県｜雨・レーダー）</h2>
      <div class="filters">
        <input id="url-pref" type="text" placeholder="都道府県検索">
        <select id="url-status">
          <option value="">すべての公開状態</option>
          <option value="published">公開済み</option>
          <option value="draft">下書き</option>
        </select>
        <strong id="url-count">47 / 47</strong>
      </div>
      <div class="url-wrap">
        <table>
          <thead>
            <tr><th>都道府県</th><th>コンテンツ</th><th>公開状態</th><th>公開URL</th><th></th></tr>
          </thead>
          <tbody id="url-table"></tbody>
        </table>
      </div>
    </section>

    <section class="admin-preview" aria-label="プレビュー">
      <iframe id="preview-frame" title="プレビュー"></iframe>
    </section>
  </div>
  <div id="toast" hidden></div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
